# Changed from the library's default of 40, as a user would, so the build
# shows that a value set here wins: the demo then says 52, not 42.
CONFIG_DEMO_BASE=50

# Set again by conf's zephyr.library.conf, to 20, in a file Zephyr reads
# after this one, so the build shows that the library's line wins: conf says
# 20, not 12.
CONFIG_NUM_PREEMPT_PRIORITIES=12
