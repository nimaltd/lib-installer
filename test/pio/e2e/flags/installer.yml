# A third library made only for the tests, with what 4.0.0 brings: flags for
# every file of the build, in groups under their titles and with a note, in
# its block of build_flags in platformio.ini, and what goes into its
# library.json under library. flags.h stops the build of any file a flag did
# not reach, the project's main.c included.

name: flags
description: What a 4.0.0 manifest brings, in a real PlatformIO build
repository: https://github.com/nimaltd/lib-installer
license: Apache-2.0

# Named, so the run needs no --platform.
platform: pio

requires:
  lib_installer: 4.0.0

headers:
  - src/flags.h
sources:
  - src/flags.c

pio:
  # Into flags' block of build_flags, in every environment, as ; comments
  # and with no blank line.
  project:
    build_flags:
      Its level:
        - -DFLAGS_LEVEL=7: flags.h stops the build without it
      Linking:
        - -Wl,--gc-sections: drops what nothing uses
  # Into its library.json, which has no room for a title or a note.
  library:
    platforms: [native]
