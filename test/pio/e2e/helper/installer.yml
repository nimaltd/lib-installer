# What demo needs. It goes into lib/ beside demo, where PlatformIO finds it.

name: helper
description: Forty, for demo to build on
repository: https://github.com/nimaltd/lib-installer
license: Apache-2.0

# Two, so the first run asks which, and --platform answers.
platform: [arduino, pio]

install:
  layout: mirror

files:
  headers:
    - src/helper.h
  sources:
    - src/helper.c
